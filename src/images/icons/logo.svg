<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer orbit ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <!-- Middle orbit ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.6" transform="rotate(30 16 16)"/>
  <!-- Inner orbit ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.4" transform="rotate(-20 16 16)"/>
  <!-- Central dot (Earth) -->
  <circle cx="16" cy="16" r="3" fill="url(#grad1)"/>
  <!-- Satellite body -->
  <g transform="translate(16, 6) rotate(45)">
    <rect x="-1.5" y="-1.5" width="3" height="3" fill="#fff" rx="0.5"/>
    <!-- Solar panels -->
    <rect x="-6" y="-0.8" width="4" height="1.6" fill="url(#grad1)" rx="0.2"/>
    <rect x="2" y="-0.8" width="4" height="1.6" fill="url(#grad1)" rx="0.2"/>
  </g>
</svg>
