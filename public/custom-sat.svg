<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Satellite body -->
  <rect x="10" y="10" width="4" height="4" rx="0.5" fill="white"/>
  <!-- Solar panels -->
  <rect x="4" y="11" width="5" height="2" rx="0.3" fill="white"/>
  <rect x="15" y="11" width="5" height="2" rx="0.3" fill="white"/>
  <!-- Antenna -->
  <line x1="12" y1="10" x2="12" y2="5" stroke="white" stroke-width="1"/>
  <circle cx="12" cy="4" r="1.5" fill="none" stroke="white" stroke-width="0.5"/>
  <!-- Plus sign -->
  <line x1="12" y1="11" x2="12" y2="13" stroke="#4facfe" stroke-width="1.5"/>
  <line x1="10.5" y1="12" x2="13.5" y2="12" stroke="#4facfe" stroke-width="1.5"/>
</svg>
