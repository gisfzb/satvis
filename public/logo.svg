<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Earth globe -->
  <circle cx="16" cy="16" r="8" fill="#0B222D" stroke="url(#grad1)" stroke-width="1"/>
  <ellipse cx="16" cy="16" rx="8" ry="3" fill="none" stroke="url(#grad1)" stroke-width="0.5" opacity="0.6"/>
  <line x1="16" y1="8" x2="16" y2="24" stroke="url(#grad1)" stroke-width="0.5" opacity="0.6"/>
  <!-- Orbit path -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Satellite on orbit -->
  <g transform="translate(16, 3) rotate(0)">
    <rect x="-2" y="-1.5" width="4" height="3" fill="#fff" rx="0.5"/>
    <rect x="-5" y="-0.8" width="2.5" height="1.6" fill="url(#grad1)" rx="0.2"/>
    <rect x="2.5" y="-0.8" width="2.5" height="1.6" fill="url(#grad1)" rx="0.2"/>
  </g>
</svg>
